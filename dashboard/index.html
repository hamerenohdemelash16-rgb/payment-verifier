<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Payment Monitor</title>
<style>
  :root {
    --paper: #F6F3EC;
    --ink: #1F2A24;
    --confirmed-green: #1E5B3A;
    --confirmed-green-light: #E6F1EB;
    --gold-accent: #B08A3E;
    --muted: #7A8079;
    --telebirr: #6B3FA0;
    --telebirr-light: #F1EAF9;
    --cbe: #1F5FA8;
    --cbe-light: #E9F1FA;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Courier New', 'Consolas', monospace;
    min-height: 100vh;
    padding: 24px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 3px double var(--ink);
    padding-bottom: 16px;
    margin-bottom: 24px;
  }

  header h1 {
    font-size: 22px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  header .amharic {
    font-size: 14px;
    color: var(--muted);
    font-family: 'Nyala', 'Noto Sans Ethiopic', sans-serif;
  }

  #clock {
    font-size: 14px;
    color: var(--muted);
  }

  #status-bar {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--confirmed-green);
    display: inline-block;
  }

  #login-screen {
    text-align: center;
    padding: 60px 20px;
  }

  #login-screen input {
    padding: 10px;
    margin: 6px;
    width: 220px;
    border: 1px solid #DDD7C8;
    font-family: 'Courier New', 'Consolas', monospace;
  }

  #login-screen button {
    padding: 10px 24px;
    margin-top: 10px;
    background: var(--confirmed-green);
    color: white;
    border: none;
    cursor: pointer;
    font-family: 'Courier New', 'Consolas', monospace;
  }

  #login-error {
    color: #B03A2E;
    font-size: 12px;
    margin-top: 10px;
  }

  #feed {
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .day-block {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .day-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 6px;
  }

  .day-header .day-title {
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .today-badge {
    background: var(--confirmed-green);
    color: white;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .day-header .day-date {
    font-size: 12px;
    color: var(--muted);
  }

  .grand-total-bar {
    background: var(--ink);
    color: var(--paper);
    padding: 10px 16px;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
  }

  .columns {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .column {
    flex: 1 1 300px;
    min-width: 280px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .column-header {
    padding: 8px 12px;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 0.5px;
    display: flex;
    justify-content: space-between;
  }

  .column-header.telebirr {
    background: var(--telebirr-light);
    color: var(--telebirr);
    border-left: 4px solid var(--telebirr);
  }

  .column-header.cbe {
    background: var(--cbe-light);
    color: var(--cbe);
    border-left: 4px solid var(--cbe);
  }

  .column-empty {
    font-size: 12px;
    color: var(--muted);
    padding: 16px;
    text-align: center;
    border: 1px dashed #DDD7C8;
  }

  .payment-card {
    background: #FFFFFF;
    border: 1px solid #DDD7C8;
    border-left: 6px solid var(--confirmed-green);
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    animation: slideIn 0.4s ease-out;
  }

  .payment-card.newest {
    border-left-color: var(--gold-accent);
    background: var(--confirmed-green-light);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .amount {
    font-size: 22px;
    font-weight: bold;
    color: var(--confirmed-green);
    white-space: nowrap;
  }

  .fields {
    text-align: right;
    font-size: 12px;
    color: var(--ink);
  }

  .fields .field-row {
    margin-top: 2px;
  }

  .fields .label {
    color: var(--muted);
    margin-right: 4px;
  }

  .checkmark {
    font-size: 18px;
    margin-right: 8px;
  }

  #empty-state {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 14px;
  }

  @media (max-width: 640px) {
    .columns { flex-direction: column; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Shop Payment Monitor</h1>
    <div class="amharic">የክፍያ ማረጋገጫ ማሳያ</div>
  </div>
  <div id="clock"></div>
</header>

<div id="status-bar">
  <span class="dot"></span>
  <span>Live — watching for CBE / Telebirr confirmations</span>
</div>

<div id="login-screen">
  <p style="margin-bottom: 12px; color: var(--muted);">Enter password to view payments</p>
  <input type="password" id="login-password" placeholder="Password" autocapitalize="off" autocorrect="off" autocomplete="new-password" spellcheck="false"><br>
  <label style="font-size:12px; color:var(--muted); display:block; margin-top:6px;">
    <input type="checkbox" id="show-password-toggle"> Show password
  </label>
  <button id="login-btn">Sign In</button>
  <p id="login-error"></p>
</div>

<div id="feed" style="display:none;">
  <div id="empty-state">No payments yet today. New payments will appear here automatically.</div>
</div>

<!-- Firebase SDKs (classic compat scripts, not ES modules) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
  console.log("Script started loading");

  const firebaseConfig = {
    apiKey: "AIzaSyDeO1gZ8a7weMl2dYLaegjRRPk11U7BGe4",
    authDomain: "payment-verifier-44099.firebaseapp.com",
    databaseURL: "https://payment-verifier-44099-default-rtdb.firebaseio.com",
    projectId: "payment-verifier-44099",
    storageBucket: "payment-verifier-44099.firebasestorage.app",
    messagingSenderId: "175284774843",
    appId: "1:175284774843:web:94b439a93b6115e740469e"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  console.log("Firebase initialized:", typeof firebase, typeof auth, typeof db);

  const feedEl = document.getElementById("feed");
  const emptyStateEl = document.getElementById("empty-state");
  const loginScreenEl = document.getElementById("login-screen");
  let firstLoad = true;
  let lastCount = 0;

  function isTelebirr(source) {
    return (source || "").toLowerCase().includes("telebirr");
  }

  function formatTime(ts) {
    return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
  }

  function renderCard(data, isNewest) {
    const card = document.createElement("div");
    card.className = "payment-card" + (isNewest ? " newest" : "");
    const time = formatTime(data.timestamp);
    card.innerHTML = `
      <div>
        <span class="checkmark">✅</span>
        <span class="amount">${data.amount} ETB</span>
      </div>
      <div class="fields">
        <div class="field-row"><span class="label">From:</span>${data.payerName || 'Unknown'}</div>
        <div class="field-row"><span class="label">Via:</span>${data.source || 'Unknown'}</div>
        <div class="field-row"><span class="label">Time:</span>${time}</div>
        <div class="field-row"><span class="label">Ref:</span>${data.txnId || 'N/A'}</div>
      </div>
    `;
    return card;
  }

  function renderFeed(entries) {
    feedEl.innerHTML = "";

    if (entries.length === 0) {
      const empty = document.createElement("div");
      empty.id = "empty-state";
      empty.textContent = "No payments yet today. New payments will appear here automatically.";
      feedEl.appendChild(empty);
      return;
    }

    const dayGroups = new Map();
    entries.forEach((data) => {
      const dateObj = new Date(data.timestamp);
      const dayKey = dateObj.toDateString();
      if (!dayGroups.has(dayKey)) dayGroups.set(dayKey, []);
      dayGroups.get(dayKey).push(data);
    });

    const todayKey = new Date().toDateString();

    dayGroups.forEach((dayEntries, dayKey) => {
      const dayBlock = document.createElement("div");
      dayBlock.className = "day-block";

      const dateObj = new Date(dayEntries[0].timestamp);
      const weekday = dateObj.toLocaleDateString([], { weekday: 'long' });
      const dateStr = dateObj.toLocaleDateString([], { month: 'long', day: 'numeric', year: 'numeric' });
      const isToday = dayKey === todayKey;

      const dayHeader = document.createElement("div");
      dayHeader.className = "day-header";
      dayHeader.innerHTML = `
        <span class="day-title">${weekday}${isToday ? '<span class="today-badge">Today</span>' : ''}</span>
        <span class="day-date">${dateStr}</span>
      `;
      dayBlock.appendChild(dayHeader);

      const telebirrEntries = dayEntries.filter(d => isTelebirr(d.source));
      const cbeEntries = dayEntries.filter(d => !isTelebirr(d.source));

      const telebirrTotal = telebirrEntries.reduce((sum, d) => sum + (Number(d.amount) || 0), 0);
      const cbeTotal = cbeEntries.reduce((sum, d) => sum + (Number(d.amount) || 0), 0);
      const grandTotal = telebirrTotal + cbeTotal;

      const grandBar = document.createElement("div");
      grandBar.className = "grand-total-bar";
      grandBar.innerHTML = `<span>Telebirr + CBE Total</span><span>${grandTotal} ETB</span>`;
      dayBlock.appendChild(grandBar);

      const columns = document.createElement("div");
      columns.className = "columns";

      const telebirrCol = document.createElement("div");
      telebirrCol.className = "column";
      const telebirrHeader = document.createElement("div");
      telebirrHeader.className = "column-header telebirr";
      telebirrHeader.innerHTML = `<span>Telebirr</span><span>${telebirrTotal} ETB</span>`;
      telebirrCol.appendChild(telebirrHeader);

      if (telebirrEntries.length === 0) {
        const empty = document.createElement("div");
        empty.className = "column-empty";
        empty.textContent = "No Telebirr payments this day.";
        telebirrCol.appendChild(empty);
      } else {
        telebirrEntries.forEach((data) => {
          telebirrCol.appendChild(renderCard(data, entries.indexOf(data) === 0));
        });
      }

      const cbeCol = document.createElement("div");
      cbeCol.className = "column";
      const cbeHeader = document.createElement("div");
      cbeHeader.className = "column-header cbe";
      cbeHeader.innerHTML = `<span>CBE</span><span>${cbeTotal} ETB</span>`;
      cbeCol.appendChild(cbeHeader);

      if (cbeEntries.length === 0) {
        const empty = document.createElement("div");
        empty.className = "column-empty";
        empty.textContent = "No CBE payments this day.";
        cbeCol.appendChild(empty);
      } else {
        cbeEntries.forEach((data) => {
          cbeCol.appendChild(renderCard(data, entries.indexOf(data) === 0));
        });
      }

      columns.appendChild(telebirrCol);
      columns.appendChild(cbeCol);
      dayBlock.appendChild(columns);

      feedEl.appendChild(dayBlock);
    });
  }

  console.log("About to attach event listeners");

  const showToggle = document.getElementById("show-password-toggle");
  if (showToggle) {
    showToggle.addEventListener("change", (e) => {
      document.getElementById("login-password").type = e.target.checked ? "text" : "password";
    });
    console.log("Show-password listener attached");
  } else {
    console.error("show-password-toggle element NOT found");
  }

  const loginBtn = document.getElementById("login-btn");
  if (loginBtn) {
    loginBtn.addEventListener("click", () => {
      console.log("Sign In button clicked");
      const email = "hamerenohdemelash16@gmail.com";
      const password = document.getElementById("login-password").value.trim();

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          console.log("Signed in successfully");
          loginScreenEl.style.display = "none";
          feedEl.style.display = "flex";

          const transactionsRef = db.ref("transactions").orderByChild("timestamp").limitToLast(300);

          transactionsRef.on("value", (snapshot) => {
            if (!snapshot.exists()) {
              renderFeed([]);
              return;
            }

            const entries = [];
            snapshot.forEach((child) => {
              entries.push(child.val());
            });

            entries.reverse();

            renderFeed(entries);

            if (!firstLoad && entries.length > lastCount) {
              playAlertSound();
            }
            lastCount = entries.length;
            firstLoad = false;
          }, (error) => {
            console.error("Realtime Database error:", error);
            document.getElementById("status-bar").innerHTML =
              '<span style="color:#B03A2E">⚠ Connection error — check internet</span>';
          });
        })
        .catch((error) => {
          console.error("Sign-in failed:", error.code, error.message);
          document.getElementById("login-error").textContent = "Wrong password (" + error.code + ")";
        });
    });
    console.log("Login button listener attached");
  } else {
    console.error("login-btn element NOT found");
  }

  function playAlertSound() {
    const audio = new Audio("data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoAAAAAAAAAAAAAAAAAAAAAAA==");
    audio.play().catch(() => {});
  }

  function updateClock() {
    document.getElementById("clock").textContent = new Date().toLocaleString([], {
      weekday: 'short', year: 'numeric', month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true
    });
  }
  setInterval(updateClock, 1000);
  updateClock();
</script>

</body>
</html>
