<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Payment Monitor</title>
<style>
  :root {
    --paper: #F6F3EC;
    --ink: #1F2A24;
    --confirmed-green: #1E5B3A;
    --confirmed-green-light: #E6F1EB;
    --gold-accent: #B08A3E;
    --muted: #7A8079;
    --telebirr: #6B3FA0;
    --telebirr-light: #F1EAF9;
    --cbe: #1F5FA8;
    --cbe-light: #E9F1FA;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Courier New', 'Consolas', monospace;
    min-height: 100vh;
    padding: 24px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 3px double var(--ink);
    padding-bottom: 16px;
    margin-bottom: 24px;
  }

  header h1 {
    font-size: 22px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  header .amharic {
    font-size: 14px;
    color: var(--muted);
    font-family: 'Nyala', 'Noto Sans Ethiopic', sans-serif;
  }

  #clock {
    font-size: 14px;
    color: var(--muted);
  }

  #status-bar {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--confirmed-green);
    display: inline-block;
  }

  #login-screen {
    text-align: center;
    padding: 60px 20px;
  }

  #login-screen input {
    padding: 10px;
    margin: 6px;
    width: 220px;
    border: 1px solid #DDD7C8;
    font-family: 'Courier New', 'Consolas', monospace;
  }

  #login-screen button {
    padding: 10px 24px;
    margin-top: 10px;
    background: var(--confirmed-green);
    color: white;
    border: none;
    cursor: pointer;
    font-family: 'Courier New', 'Consolas', monospace;
  }

  #login-error {
    color: #B03A2E;
    font-size: 12px;
    margin-top: 10px;
  }

  #feed {
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .day-block {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .day-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 6px;
  }

  .day-header .day-title {
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .today-badge {
    background: var(--confirmed-green);
    color: white;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .day-header .day-date {
    font-size: 12px;
    color: var(--muted);
  }

  .grand-total-bar {
    background: var(--ink);
    color: var(--paper);
    padding: 10px 16px;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
  }

  .columns {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .column {
    flex: 1 1 300px;
    min-width: 280px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .column-header {
    padding: 8px 12px;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 0.5px;
    display: flex;
    justify-content: space-between;
  }

  .column-header.telebirr {
    background: var(--telebirr-light);
    color: var(--telebirr);
    border-left: 4px solid var(--telebirr);
  }

  .column-header.cbe {
    background: var(--cbe-light);
    color: var(--cbe);
    border-left: 4px solid var(--cbe);
  }

  .column-empty {
    font-size: 12px;
    color: var(--muted);
    padding: 16px;
    text-align: center;
    border: 1px dashed #DDD7C8;
  }

  .payment-card {
    background: #FFFFFF;
    border: 1px solid #DDD7C8;
    border-left: 6px solid var(--confirmed-green);
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    animation: slideIn 0.4s ease-out;
  }

  .payment-card.newest {
    border-left-color: var(--gold-accent);
    background: var(--confirmed-green-light);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .amount {
    font-size: 22px;
    font-weight: bold;
    color: var(--confirmed-green);
    white-space: nowrap;
  }

  .fields {
    text-align: right;
    font-size: 12px;
    color: var(--ink);
  }

  .fields .field-row {
    margin-top: 2px;
  }

  .fields .label {
    color: var(--muted);
    margin-right: 4px;
  }

  .checkmark {
    font-size: 18px;
    margin-right: 8px;
  }

  #empty-state {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 14px;
  }

  @media (max-width: 640px) {
    .columns { flex-direction: column; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Shop Payment Monitor</h1>
    <div class="amharic">የክፍያ ማረጋገጫ ማሳያ</div>
  </div>
  <div id="clock"></div>
</header>

<div id="status-bar">
  <span class="dot"></span>
  <span>Live — watching for CBE / Telebirr confirmations</span>
</div>

<div id="login-screen">
  <p style="margin-bottom: 12px; color: var(--muted);">Enter password to view payments</p>
  <input type="password" id="login-password" placeholder="Password" autocapitalize="off" autocorrect="off" autocomplete="new-password" spellcheck="false"><br>
  <label style="font-size:12px; color:var(--muted); display:block; margin-top:6px;">
    <input type="checkbox" id="show-password-toggle"> Show password
  </label>
  <button id="login-btn">Sign In</button>
  <p id="login-error"></p>
</div>

<div id="feed" style="display:none;">
  <div id="empty-state">No payments yet today. New payments will appear here automatically.</div>
</div>
